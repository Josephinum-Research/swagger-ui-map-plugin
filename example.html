<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SwaggerUI" />
    <title>SwaggerUI</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.1.0/ol.css">
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://cdn.jsdelivr.net/npm/ol@v10.1.0/dist/ol.js" crossorigin></script>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@josephinumresearch/swagger-ui-map-plugin/dist/swagger-ui-map-plugin.js" crossorigin></script>
<script>
    window.onload = () => {
        window.ui = SwaggerUIBundle({
            url: 'https://api.terrazo.at/api-docs/latest:%20v2',
            filter: 'Demo',
            plugins: [
                SwaggerUiMapPlugin({
                    renderer: {
                        geojson: {
                            activationFnc: props => ['application/geo+json', 'application/json'].includes(props.contentType),
                            config: {
                                defaultStrokeWidth: '2'
                            }
                        }
                    }
                })
            ],
            dom_id: '#swagger-ui',
        });
    };
</script>
</body>
</html>
